name: SpaceXAI documentation and Brands validation

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - codex/spacexai-docs-validation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spacexai-docs-brands-${{ github.ref }}
  cancel-in-progress: false

jobs:
  documentation:
    if: github.repository == 'jeffglousher/core'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - layer: initial
            revision: 44526b046fa26d4ddf0ab037850a54e30ecbf1d0
          - layer: final
            revision: 69221dc8a853972e4b4fcbf78d4fbba8047b393d
    defaults:
      run:
        working-directory: docs
        shell: bash
    steps:
      - name: Check out exact documentation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jeffglousher/home-assistant.io
          ref: ${{ matrix.revision }}
          path: docs
          persist-credentials: false
      - name: Install Ruby and locked Jekyll dependencies
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: 3.4.8
          working-directory: docs
          bundler-cache: true
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: docs/.nvmrc
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Record and verify tested source
        env:
          EXPECTED_SHA: ${{ matrix.revision }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          {
            git rev-parse HEAD
            ruby --version
            bundle exec jekyll --version
            node --version
          } | tee validation-sources.txt
      - name: Run native documentation linters
        run: |
          npm ci
          mapfile -t pages < <(find source/_integrations source/_actions -name 'spacexai*.markdown' -type f)
          npx --no-install remark --quiet --frail --no-stdout "${pages[@]}"
          npx --no-install textlint "${pages[@]}"
      - name: Build with the prescribed Jekyll task
        run: |
          set -o pipefail
          bundle exec rake generate 2>&1 | tee native-build.txt
          test -s public/integrations/spacexai/index.html
          if [[ '${{ matrix.layer }}' == 'final' ]]; then
            cmp source/blueprints/integrations/spacexai_publish_media_notification.yaml \
              public/blueprints/integrations/spacexai_publish_media_notification.yaml
          fi
      - name: Save rendered pages and native build evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spacexai-docs-${{ matrix.layer }}-${{ github.run_id }}
          path: |
            docs/validation-sources.txt
            docs/native-build.txt
            docs/public/integrations/spacexai/
            docs/public/actions/spacexai.generate_video/
            docs/public/actions/spacexai.publish_media/
            docs/public/blueprints/integrations/spacexai_publish_media_notification.yaml
            docs/public/stylesheets/
            docs/public/javascripts/
            docs/public/assets/
            docs/public/favicon.png
            docs/public/images/home-assistant-logo.svg
          if-no-files-found: warn
          retention-days: 14

  blueprint:
    if: github.repository == 'jeffglousher/core'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: core
        shell: bash
    steps:
      - name: Check out validation helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: validation
          persist-credentials: false
      - name: Check out exact Core source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 07c95d71202a7599cd4f91070df8a41a958a0524
          path: core
          persist-credentials: false
      - name: Check out exact documentation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jeffglousher/home-assistant.io
          ref: 69221dc8a853972e4b4fcbf78d4fbba8047b393d
          path: docs
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: 0.12.6
      - name: Install native Home Assistant schema environment
        run: |
          uv venv .venv --python "$(cat .python-version)"
          source .venv/bin/activate
          uv pip install -r requirements.txt -e . --config-settings editable_mode=compat
      - name: Validate blueprint and input substitution without executing actions
        run: |
          source .venv/bin/activate
          set -o pipefail
          {
            git rev-parse HEAD
            git -C ../docs rev-parse HEAD
            python3 --version
          } | tee blueprint-sources.txt
          python3 ../validation/script/spacexai_validate_blueprint.py \
            ../docs/source/blueprints/integrations/spacexai_publish_media_notification.yaml \
            | tee blueprint-validation.json
      - name: Save blueprint validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spacexai-blueprint-${{ github.run_id }}
          path: |
            core/blueprint-sources.txt
            core/blueprint-validation.json
          if-no-files-found: warn
          retention-days: 14

  brands:
    if: github.repository == 'jeffglousher/core'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: brands
        shell: bash
    steps:
      - name: Check out exact Brands source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jeffglousher/brands
          ref: e3ac8da8bf579ec54210cc211e1eaa0768052679
          path: brands
          persist-credentials: false
      - name: Install native image validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y imagemagick optipng
      - name: Record and verify tested source
        run: |
          test "$(git rev-parse HEAD)" = 'e3ac8da8bf579ec54210cc211e1eaa0768052679'
          {
            git rev-parse HEAD
            identify -version
            sha256sum core_integrations/spacexai/*.png
          } | tee validation-sources.txt
      - name: Run the repository image validator
        run: |
          set -o pipefail
          bash .github/workflows/validate/validate.sh 2>&1 | tee native-validation.txt
      - name: Save native validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spacexai-brands-${{ github.run_id }}
          path: |
            brands/validation-sources.txt
            brands/native-validation.txt
          if-no-files-found: warn
          retention-days: 14
