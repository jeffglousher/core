generate_video:
  fields:
    config_entry:
      required: true
      selector:
        config_entry:
          integration: spacexai
    prompt:
      required: true
      selector:
        text:
          multiline: true
    model:
      required: false
      default: grok-imagine-video-1.5
      selector:
        select:
          options:
            - grok-imagine-video-1.5
            - grok-imagine-video
          custom_value: true
    image_url:
      required: false
      selector:
        text:
    duration:
      required: false
      selector:
        number:
          min: 1
          max: 15
          mode: box
