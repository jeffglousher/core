rules:
  # Bronze
  action-setup: done
  appropriate-polling:
    status: exempt
    comment: Integration does not poll periodically; it validates on setup and responds to user requests.
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions: done
  docs-conditions:
    status: exempt
    comment: Integration does not provide conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: Integration does not provide triggers.
  entity-event-setup:
    status: exempt
    comment: Conversation entities do not subscribe to integration events.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: done
    comment: spacexai.generate_video raises ServiceValidationError/HomeAssistantError with translation keys.
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: Service integration, no discovery.
  discovery:
    status: exempt
    comment: Service integration, no discovery.
  docs-data-update:
    status: exempt
    comment: On-demand LLM responses; no periodic data update cadence to document.
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices:
    status: exempt
    comment: Service integration, no physical devices.
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: Service integration, no discovered devices.
  entity-category:
    status: exempt
    comment: Conversation, AI Task, STT, and TTS entities are primary service entities.
  entity-device-class:
    status: exempt
    comment: Conversation, AI Task, STT, and TTS entities do not have device classes.
  entity-disabled-by-default:
    status: exempt
    comment: The configured conversation, AI Task, STT, and TTS entities are the primary integration features.
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues: done
  stale-devices:
    status: exempt
    comment: Service integration, no discovered devices.

  # Platinum
  async-dependency: done
  inject-websession:
    status: done
    comment: Uses Home Assistant's shared httpx and aiohttp clients.
  strict-typing: done
