rules:
  # Bronze
  action-setup: done
  appropriate-polling:
    status: exempt
    comment: The integration only makes requests for user-initiated AI and speech operations.
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: todo
  docs-actions: done
  docs-conditions:
    status: exempt
    comment: The integration does not provide conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration does not provide triggers.
  entity-event-setup:
    status: exempt
    comment: The stateless service entities do not subscribe to events.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: todo
  docs-installation-parameters: todo
  entity-unavailable:
    status: exempt
    comment: The integration provides stateless, on-demand service entities.
  integration-owner: done
  log-when-unavailable:
    status: exempt
    comment: The integration provides stateless, on-demand service entities.
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: todo

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: The cloud service cannot be discovered.
  discovery:
    status: exempt
    comment: The cloud service cannot be discovered.
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: todo
  docs-supported-devices:
    status: exempt
    comment: The integration represents a cloud service, not physical devices.
  docs-supported-functions: todo
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices:
    status: exempt
    comment: The integration represents a cloud service, not physical devices.
  entity-category:
    status: exempt
    comment: The service entities are primary integration features.
  entity-device-class:
    status: exempt
    comment: AI task, conversation, STT, and TTS entities do not have device classes.
  entity-disabled-by-default:
    status: exempt
    comment: User-created service entities are enabled by default.
  entity-translations: done
  exception-translations: done
  icon-translations:
    status: exempt
    comment: The integration does not use custom entity icons.
  reconfiguration-flow: done
  repair-issues:
    status: exempt
    comment: The integration has no actionable repair issues.
  stale-devices:
    status: exempt
    comment: The integration represents a cloud service, not physical devices.

  # Platinum
  async-dependency: done
  inject-websession:
    status: done
    comment: The client receives Home Assistant's shared aiohttp and httpx sessions.
  strict-typing: done
